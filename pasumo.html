<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PASMO画面遷移</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-container {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    .screen.active {
      display: block;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* --- タップエリアの設定 --- */
    .hotspot {
      position: absolute;
      cursor: pointer;
      z-index: 100;
      /* 位置確認用の赤枠（確定したら transparent に変更） */
      background-color: rgba(255, 0, 0, 0.25);
      border: 1px solid red;
    }

    /* --- 画面1（1.jpg）のタップ位置 --- */
    /* 鉄道定期券（中央の白い四角いエリア） */
    #screen1 .spot-train-pass {
      top: 57.5%;
      left: 5%;
      width: 90%;
      height: 13%;
    }
    /* 詳細（右上 i アイコン） */
    #screen1 .spot-details {
      top: 45.5%;
      left: 79%;
      width: 16%;
      height: 9%;
    }
    /* 定期券メニュー（中央下の枠） */
    #screen1 .spot-pass-menu {
      top: 71%;
      left: 31%;
      width: 38%;
      height: 7%;
    }

    /* --- 画面2（2.jpg）のタップ位置 --- */
    /* 鉄道定期券メニュー */
    #screen2 .spot-train-menu {
      top: 86.5%;
      left: 32%;
      width: 36%;
      height: 4%;
    }
    /* 閉じる（右上 × ボタン） */
    #screen2 .spot-close {
      top: 41.5%;
      left: 86%;
      width: 10%;
      height: 4%;
    }

    /* --- 画面3（3.jpg）のタップ位置 --- */
    /* 戻る（左上 ＜戻る） */
    #screen3 .spot-back {
      top: 5.5%;
      left: 0%;
      width: 22%;
      height: 5%;
    }

    /* --- 画面4（4.jpg）のタップ位置 --- */
    /* 鉄道定期券 */
    #screen4 .spot-train-pass {
      top: 85.5%;
      left: 5%;
      width: 90%;
      height: 5%;
    }
    /* 戻る（左上 ＜戻る） */
    #screen4 .spot-back {
      top: 5.5%;
      left: 0%;
      width: 22%;
      height: 5%;
    }

    /* --- 画面5（5.jpg）のタップ位置 --- */
    /* 鉄道定期券 */
    #screen5 .spot-train-pass {
      top: 76%;
      left: 5%;
      width: 90%;
      height: 6%;
    }
    /* 閉じる（右上 × ボタン） */
    #screen5 .spot-close {
      top: 63.5%;
      left: 86%;
      width: 10%;
      height: 4%;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 画面 1 -->
    <div id="screen1" class="screen active">
      <img src="1.jpg" alt="画面1">
      <div class="hotspot spot-train-pass" onclick="goToScreen('screen2')"></div>
      <div class="hotspot spot-details" onclick="goToScreen('screen4')"></div>
      <div class="hotspot spot-pass-menu" onclick="goToScreen('screen5')"></div>
    </div>

    <!-- 画面 2 -->
    <div id="screen2" class="screen">
      <img src="2.jpg" alt="画面2">
      <div class="hotspot spot-train-menu" onclick="goToScreen('screen3')"></div>
      <div class="hotspot spot-close" onclick="goToScreen('screen1')"></div>
    </div>

    <!-- 画面 3 -->
    <div id="screen3" class="screen">
      <img src="3.jpg" alt="画面3">
      <div class="hotspot spot-back" onclick="goToScreen('screen1')"></div>
    </div>

    <!-- 画面 4 -->
    <div id="screen4" class="screen">
      <img src="4.jpg" alt="画面4">
      <div class="hotspot spot-train-pass" onclick="goToScreen('screen3')"></div>
      <div class="hotspot spot-back" onclick="goToScreen('screen1')"></div>
    </div>

    <!-- 画面 5 -->
    <div id="screen5" class="screen">
      <img src="5.jpg" alt="画面5">
      <div class="hotspot spot-train-pass" onclick="goToScreen('screen3')"></div>
      <div class="hotspot spot-close" onclick="goToScreen('screen1')"></div>
    </div>
  </div>

  <script>
    function goToScreen(screenId) {
      const screens = document.querySelectorAll('.screen');
      screens.forEach(s => s.classList.remove('active'));
      
      const targetScreen = document.getElementById(screenId);
      if (targetScreen) {
        targetScreen.classList.add('active');
      }
    }
  </script>
</body>
</html>
