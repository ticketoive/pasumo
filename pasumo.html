<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PASMO</title>
  
  <!-- iPhoneホーム画面追加時のフルスクリーン・アイコン設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icon.jpeg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fff;
      position: fixed;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    .app-container {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100dvh;
      background-color: #fff;
      overflow: hidden;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .screen.active {
      display: block;
    }

    /* --- 画面1（上部バナー固定 ＋ 下部スクロール） --- */
    #screen1 {
      display: none;
    }
    #screen1.active {
      display: block;
    }
    .sticky-header-mask {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 155px; 
      overflow: hidden;
      z-index: 50;
      background-color: #fff;
    }
    .sticky-header-mask img {
      width: 100%;
      height: auto;
      display: block;
    }
    .screen1-content {
      position: relative;
      width: 100%;
      margin-top: -155px; 
    }
    .screen1-content img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }

    /* --- 通常画面（画面2〜8） --- */
    .screen-inner {
      position: relative;
      width: 100%;
      min-height: 100%;
      background-color: #fff;
    }
    .screen-inner img {
      width: 100%;
      height: auto;
      display: block;
      image-rendering: -webkit-optimize-contrast;
    }

    /* --- 透明タップエリア --- */
    .hotspot {
      position: absolute;
      cursor: pointer;
      z-index: 100;
      background-color: transparent;
      border: none;
    }

    /* --- 各画面のホットスポット位置調整 --- */
    /* 画面1 */
    #screen1 .spot-menu { top: 38px; left: 0px; width: 90px; height: 75px; z-index: 200; }
    #screen1 .spot-train-pass { top: 57.5%; left: 5%; width: 90%; height: 13%; }
    #screen1 .spot-details { top: 45.5%; left: 79%; width: 16%; height: 9%; }
    #screen1 .spot-history { top: 45.5%; left: 60%; width: 18%; height: 9%; }
    #screen1 .spot-pass-menu { top: 71%; left: 31%; width: 38%; height: 7%; }
    #screen1 .spot-charge { top: 82.5%; left: 19%; width: 62%; height: 8%; }

    /* 画面2 */
    #screen2 .spot-train-menu { top: 86.5%; left: 32%; width: 36%; height: 4%; }
    #screen2 .spot-close { top: 41.5%; left: 86%; width: 10%; height: 4%; }

    /* 画面3 */
    #screen3 .spot-back { top: 5.5%; left: 0%; width: 22%; height: 5%; }

    /* 画面4 */
    #screen4 .spot-train-pass { top: 85.5%; left: 5%; width: 90%; height: 5%; }
    #screen4 .spot-back { top: 5.5%; left: 0%; width: 22%; height: 5%; }

    /* 画面5 */
    #screen5 .spot-train-pass { top: 76%; left: 5%; width: 90%; height: 6%; }
    #screen5 .spot-close { top: 63.5%; left: 86%; width: 10%; height: 4%; }

    /* 画面6（サイドメニュー） */
    #screen6 .spot-overlay-close { top: 0%; left: 59%; width: 41%; height: 100%; position: absolute; }

    /* 画面7（チャージ） */
    #screen7 .spot-close { top: 20.5%; left: 85%; width: 12%; height: 5%; }

    /* 画面8（残額履歴） */
    #screen8 .spot-back { top: 5.5%; left: 0%; width: 22%; height: 5%; position: fixed; z-index: 200; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 画面 1 -->
    <div id="screen1" class="screen active">
      <div class="sticky-header-mask">
        <img src="1.jpg" alt="ヘッダー固定">
        <div class="hotspot spot-menu" onclick="goToScreen('screen6')"></div>
      </div>
      <div class="screen1-content">
        <img src="1.jpg" alt="画面1">
        <div class="hotspot spot-train-pass" onclick="goToScreen('screen2')"></div>
        <div class="hotspot spot-details" onclick="goToScreen('screen4')"></div>
        <div class="hotspot spot-history" onclick="goToScreen('screen8')"></div>
        <div class="hotspot spot-pass-menu" onclick="goToScreen('screen5')"></div>
        <div class="hotspot spot-charge" onclick="goToScreen('screen7')"></div>
      </div>
    </div>

    <!-- 画面 2 -->
    <div id="screen2" class="screen">
      <div class="screen-inner">
        <img src="2.jpg" alt="画面2">
        <div class="hotspot spot-train-menu" onclick="goToScreen('screen3')"></div>
        <div class="hotspot spot-close" onclick="goToScreen('screen1')"></div>
      </div>
    </div>

    <!-- 画面 3 -->
    <div id="screen3" class="screen">
      <div class="screen-inner">
        <img src="3.jpg" alt="画面3">
        <div class="hotspot spot-back" onclick="goToScreen('screen1')"></div>
      </div>
    </div>

    <!-- 画面 4 -->
    <div id="screen4" class="screen">
      <div class="screen-inner">
        <img src="4.jpg" alt="画面4">
        <div class="hotspot spot-train-pass" onclick="goToScreen('screen3')"></div>
        <div class="hotspot spot-back" onclick="goToScreen('screen1')"></div>
      </div>
    </div>

    <!-- 画面 5 -->
    <div id="screen5" class="screen">
      <div class="screen-inner">
        <img src="5.jpg" alt="画面5">
        <div class="hotspot spot-train-pass" onclick="goToScreen('screen3')"></div>
        <div class="hotspot spot-close" onclick="goToScreen('screen1')"></div>
      </div>
    </div>

    <!-- 画面 6（サイドメニュー） -->
    <div id="screen6" class="screen">
      <div class="screen-inner" style="height: 100%;">
        <img src="6.jpeg" alt="画面6" style="height: 100%; object-fit: cover;">
        <div class="hotspot spot-overlay-close" onclick="goToScreen('screen1')"></div>
      </div>
    </div>

    <!-- 画面 7（チャージ） -->
    <div id="screen7" class="screen">
      <div class="screen-inner">
        <img src="7.jpeg" alt="画面7">
        <div class="hotspot spot-close" onclick="goToScreen('screen1')"></div>
      </div>
    </div>

    <!-- 画面 8（残額履歴） -->
    <div id="screen8" class="screen">
      <div class="screen-inner">
        <div class="hotspot spot-back" onclick="goToScreen('screen1')"></div>
        <img src="8.jpeg" alt="画面8">
      </div>
    </div>
  </div>

  <script>
    function goToScreen(screenId) {
      const screens = document.querySelectorAll('.screen');
      screens.forEach(s => s.classList.remove('active'));
      
      const targetScreen = document.getElementById(screenId);
      if (targetScreen) {
        targetScreen.classList.add('active');
        targetScreen.scrollTop = 0;
      }
    }
  </script>
</body>
</html>
