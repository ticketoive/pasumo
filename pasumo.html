<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PASMO画面遷移</title>
  
  <!-- アプリ風（フルスクリーン）にする設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- ホーム画面のアイコン設定 -->
  <link rel="apple-touch-icon" href="icon.jpeg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-container {
      position: relative;
      width: 100vw;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    .screen.active {
      display: block;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* --- タップエリア（透明） --- */
    .hotspot {
      position: absolute;
      cursor: pointer;
      z-index: 100;
      background-color: transparent;
      border: none;
    }

    /* --- 各画面のタップ位置 --- */
    #screen1 .spot-train-pass { top: 57.5%; left: 5%; width: 90%; height: 13%; }
    #screen1 .spot-details { top: 45.5%; left: 79%; width: 16%; height: 9%; }
    #screen1 .spot-pass-menu { top: 71%; left: 31%; width: 38%; height: 7%; }

    #screen2 .spot-train-menu { top: 86.5%; left: 32%; width: 36%; height: 4%; }
    #screen2 .spot-close { top: 41.5%; left: 86%; width: 10%; height: 4%; }

    #screen3 .spot-back { top: 5.5%; left: 0%; width: 22%; height: 5%; }

    #screen4 .spot-train-pass { top: 85.5%; left: 5%; width: 90%; height: 5%; }
    #screen4 .spot-back { top: 5.5%; left: 0%; width: 22%; height: 5%; }

    #screen5 .spot-train-pass { top: 76%; left: 5%; width: 90%; height: 6%; }
    #screen5 .spot-close { top: 63.5%; left: 86%; width: 10%; height: 4%; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 画面 1 -->
    <div id="screen1" class="screen active">
      <img src="1.jpg" alt="画面1">
      <div class="hotspot spot-train-pass" onclick="goToScreen('screen2')"></div>
      <div class="hotspot spot-details" onclick="goToScreen('screen4')"></div>
      <div class="hotspot spot-pass-menu" onclick="goToScreen('screen5')"></div>
    </div>

    <!-- 画面 2 -->
    <div id="screen2" class="screen">
      <img src="2.jpg" alt="画面2">
      <div class="hotspot spot-train-menu" onclick="goToScreen('screen3')"></div>
      <div class="hotspot spot-close" onclick="goToScreen('screen1')"></div>
    </div>

    <!-- 画面 3 -->
    <div id="screen3" class="screen">
      <img src="3.jpg" alt="画面3">
      <div class="hotspot spot-back" onclick="goToScreen('screen1')"></div>
    </div>

    <!-- 画面 4 -->
    <div id="screen4" class="screen">
      <img src="4.jpg" alt="画面4">
      <div class="hotspot spot-train-pass" onclick="goToScreen('screen3')"></div>
      <div class="hotspot spot-back" onclick="goToScreen('screen1')"></div>
    </div>

    <!-- 画面 5 -->
    <div id="screen5" class="screen">
      <img src="5.jpg" alt="画面5">
      <div class="hotspot spot-train-pass" onclick="goToScreen('screen3')"></div>
      <div class="hotspot spot-close" onclick="goToScreen('screen1')"></div>
    </div>
  </div>

  <script>
    function goToScreen(screenId) {
      const screens = document.querySelectorAll('.screen');
      screens.forEach(s => s.classList.remove('active'));
      
      const targetScreen = document.getElementById(screenId);
      if (targetScreen) {
        targetScreen.classList.add('active');
      }
    }
  </script>
</body>
</html>
