<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PASMO画面遷移</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: #fff;
      overflow: hidden;
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    .screen.active {
      display: block;
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .hotspot {
      position: absolute;
      cursor: pointer;
      /* デバッグ時に領域を確認したい場合は下行のコメントを解除 */
      /* background: rgba(255, 0, 0, 0.3); */
    }

    /* --- 画面1のタップ領域 --- */
    /* 鉄道定期券（カード下部） */
    #screen1 .spot-train-pass {
      top: 61%;
      left: 6%;
      width: 88%;
      height: 4.5%;
    }
    /* 定期券メニュー（下部メニュー） */
    #screen1 .spot-pass-menu {
      top: 91.5%;
      left: 6%;
      width: 88%;
      height: 4.5%;
    }
    /* 詳細（カード横の i アイコン付近） */
    #screen1 .spot-details {
      top: 50.5%;
      left: 81.5%;
      width: 13%;
      height: 6%;
    }

    /* --- 画面2のタップ領域 --- */
    /* 鉄道定期券メニュー */
    #screen2 .spot-train-menu {
      top: 86.5%;
      left: 32%;
      width: 36%;
      height: 3.5%;
    }
    /* 戻る（×ボタン） */
    #screen2 .spot-close {
      top: 42%;
      left: 87%;
      width: 9%;
      height: 3.5%;
    }

    /* --- 画面4のタップ領域 --- */
    /* 鉄道定期券 */
    #screen4 .spot-train-pass {
      top: 85.5%;
      left: 6%;
      width: 88%;
      height: 4.5%;
    }
    /* 戻る（左上＜戻る） */
    #screen4 .spot-back {
      top: 7%;
      left: 2%;
      width: 18%;
      height: 3.5%;
    }

    /* --- 画面5のタップ領域 --- */
    /* 鉄道定期券 */
    #screen5 .spot-train-pass {
      top: 76.5%;
      left: 6%;
      width: 88%;
      height: 6%;
    }
    /* 戻る（×ボタン） */
    #screen5 .spot-close {
      top: 64%;
      left: 87%;
      width: 9%;
      height: 3.5%;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 画面 1 -->
    <div id="screen1" class="screen active">
      <img src="1.jpg" alt="画面1">
      <div class="hotspot spot-train-pass" onclick="showScreen('screen2')"></div>
      <div class="hotspot spot-pass-menu" onclick="showScreen('screen5')"></div>
      <div class="hotspot spot-details" onclick="showScreen('screen4')"></div>
    </div>

    <!-- 画面 2 -->
    <div id="screen2" class="screen">
      <img src="1.jpg" alt="画面2">
      <div class="hotspot spot-train-menu" onclick="showScreen('screen3')"></div>
      <div class="hotspot spot-close" onclick="showScreen('screen1')"></div>
    </div>

    <!-- 画面 3 -->
    <div id="screen3" class="screen">
      <img src="3.jpg" alt="画面3">
      <div class="hotspot" style="top: 7%; left: 2%; width: 18%; height: 3.5%;" onclick="showScreen('screen1')"></div>
    </div>

    <!-- 画面 4 -->
    <div id="screen4" class="screen">
      <img src="4.jpg" alt="画面4">
      <div class="hotspot spot-train-pass" onclick="showScreen('screen3')"></div>
      <div class="hotspot spot-back" onclick="showScreen('screen1')"></div>
    </div>

    <!-- 画面 5 -->
    <div id="screen5" class="screen">
      <img src="5.jpg" alt="画面5">
      <div class="hotspot spot-train-pass" onclick="showScreen('screen3')"></div>
      <div class="hotspot spot-close" onclick="showScreen('screen1')"></div>
    </div>
  </div>

  <script>
    function showScreen(screenId) {
      const screens = document.querySelectorAll('.screen');
      screens.forEach(s => s.classList.remove('active'));
      
      const targetScreen = document.getElementById(screenId);
      if (targetScreen) {
        targetScreen.classList.add('active');
      }
    }
  </script>
</body>
</html>
